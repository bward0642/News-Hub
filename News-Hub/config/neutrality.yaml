# Headlines using any of these words/phrases are skipped (charged or partisan framing).
charged_words:
  - slams
  - slammed
  - blasts
  - blasted
  - rips
  - ripped into
  - destroys
  - radical
  - radicals
  - war on
  - outrage
  - outraged
  - bombshell
  - caves
  - doubles down
  - woke
  - MAGA
  - far-left
  - far-right
  - socialist
  - socialists
  - extremist
  - extremists
  - Democrat
  - Democrats
  - Democratic
  - Dems
  - Republican
  - Republicans
  - GOP
  - liberals
  - conservatives
  - leftist
  - leftists
  - right-wing
  - left-wing
  - partisan

# Opinion pieces are skipped on the news tabs (the Market Watch commentary section allows
# market analysis, but still applies the lists above).
opinion_markers:
  - "Opinion:"
  - "Opinion |"
  - Op-Ed
  - Op-ed
  - Editorial
  - Letter to the editor
  - Letters to the editor
  - "Column:"
  - "Guest column"
opinion_url_paths:
  - /opinion/
  - /opinions/
  - /op-ed/
  - /editorial/
  - /editorials/
  - /letters/
