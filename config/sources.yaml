# Where the hub looks for news each week.
#
# type:
#   rss              - a normal RSS/Atom feed (url required)
#   federal_register - official rules & notices from the Federal Register (agency required)
#   google_news      - a Google News search (query required); shown as "News coverage"
#
# default_topic: topic to use when no keyword matches (leave out to DROP unmatched items)
# official: true = government / nonprofit source, shown with an "Official" badge
# max_items: optional cap on how many items to take from this source per run

sources:
  # ---- Official government sources ----
  - id: fr-education
    name: Dept. of Education (Federal Register)
    type: federal_register
    agency: education-department
    official: true
    # no default_topic: only rules/notices that match a topic keyword are kept

  - id: fr-cfpb
    name: CFPB (Federal Register)
    type: federal_register
    agency: consumer-financial-protection-bureau
    official: true
    default_topic: consumer-credit

  - id: cfpb-news
    name: CFPB Newsroom
    type: rss
    url: https://www.consumerfinance.gov/about-us/newsroom/feed/
    official: true
    default_topic: consumer-credit

  - id: ftc-alerts
    name: FTC Consumer Alerts
    type: rss
    url: https://consumer.ftc.gov/blog/rss
    official: true
    default_topic: consumer-credit

  - id: ftc-press
    name: FTC Consumer Protection News
    type: rss
    url: https://www.ftc.gov/feeds/press-release-consumer-protection.xml
    official: true
    # no default_topic: only kept when it matches a topic keyword

  - id: fed
    name: Federal Reserve
    type: rss
    url: https://www.federalreserve.gov/feeds/press_all.xml
    official: true

  - id: fdic
    name: FDIC
    type: rss
    url: https://www.fdic.gov/rss.xml
    official: true

  - id: mymoney
    name: MyMoney.gov
    type: rss
    url: https://www.mymoney.gov/rss.xml
    official: true
    default_topic: teaching

  - id: studentaid
    name: StudentAid.gov
    type: rss
    url: https://studentaid.gov/articles/feed
    official: true
    default_topic: student-loans

  # ---- Financial education & consumer nonprofits ----
  - id: cee
    name: Council for Economic Education
    type: rss
    url: https://www.councilforeconed.org/feed/
    official: true
    default_topic: teaching

  - id: everfi
    name: EVERFI
    type: rss
    url: https://everfi.com/feed/
    official: true
    # only kept when it matches a topic keyword (feed also has corporate news)

  - id: nclc
    name: National Consumer Law Center
    type: rss
    url: https://www.nclc.org/feed/
    official: true
    default_topic: consumer-credit

  - id: ticas
    name: TICAS (college affordability)
    type: rss
    url: https://ticas.org/feed/
    official: true
    # only kept when it matches a topic keyword

  - id: insidehighered
    name: Inside Higher Ed
    type: rss
    url: https://www.insidehighered.com/rss.xml
    # only kept when it matches a topic keyword

  - id: jumpstart
    name: Jump$tart Coalition
    type: rss
    url: https://www.jumpstart.org/feed/
    official: true
    # only kept when it matches a topic keyword (feed also lists new member organizations)

  # ---- Wider news coverage (Google News searches) ----
  - id: gn-student-loans
    name: News — Student loans
    type: google_news
    query: '"student loan" OR "student loans" OR PSLF OR "income-driven repayment"'
    default_topic: student-loans
    max_items: 20

  - id: gn-fafsa
    name: News — FAFSA & aid
    type: google_news
    query: 'FAFSA OR "Pell Grant" OR "financial aid" college'
    default_topic: fafsa
    max_items: 15

  - id: gn-credit
    name: News — Credit & banking
    type: google_news
    query: 'CFPB OR "credit score" OR "overdraft fees" OR "credit report" OR "buy now pay later" OR "junk fees" -game -gaming'
    default_topic: consumer-credit
    max_items: 15

  - id: gn-teaching
    name: News — Financial literacy education
    type: google_news
    query: '"financial literacy" students'
    default_topic: teaching
    max_items: 12

# News outlets to ignore (press-release wires, video sites, etc.). Matches the publisher name.
exclude_publishers:
  - YouTube
  - EIN Presswire
  - TradingView
  - Medium
  - PR Newswire
  - Business Wire
  - businesswire.com
  - GlobeNewswire
  - Newswire
  - openPR
  - TAPinto
  - Yogonet
  - World Casino News
  - Quiver Quantitative
  - Pluang

# Google News items are only kept from publishers whose web address ends in one of these.
# (Filters out most non-U.S. outlets.) Leave the list empty to allow all.
allowed_publisher_domains: [.com, .org, .gov, .edu, .net, .us, .news]

# Items whose titles contain any of these phrases are skipped (routine paperwork notices).
exclude_titles:
  - Agency Information Collection Activities
  - Sunshine Act
  - Privacy Act of 1974
  - Paperwork Reduction Act
  - Meeting Notice
  - Open Meeting
  - Senior Executive Service
  # non-U.S. stories that slip through the news searches
  - India
  - Indian
  - UAE
  - Dubai
  - Egypt
  - Kuwait
  - Nigeria
  - Ghana
  - Kenya
  - Philippines
  - Pakistan
  - Sri Lanka
  - Dutch
  - Australia
  - New Zealand
  - Canada
  - Canadian
  - UK
  - Britain
  - Armenia
  - Malaysia
  - Singapore
  - Zimbabwe
  - South Africa
