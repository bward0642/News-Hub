name: Weekly update

on:
  schedule:
    - cron: "0 10 * * 1"    # Mondays 10:00 UTC (6 AM Eastern in summer, 5 AM in winter): full news update
    - cron: "15 * * * *"    # every hour: publish newly approved staff notes & tips
  workflow_dispatch:         # "Run workflow" button: full update on demand (use after editing config)

permissions:
  contents: write   # save news & approved notes back to data/
  pages: write
  id-token: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    env:
      # Full run = Monday schedule or the manual button. Otherwise it's the hourly notes check.
      FULL_RUN: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 * * 1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch approved staff notes
        id: notes
        env:
          NOTES_CSV_URL: ${{ secrets.NOTES_CSV_URL }}
        run: python scripts/fetch_notes.py

      - name: Fetch this week's news
        if: env.FULL_RUN == 'true'
        run: python scripts/fetch_news.py

      - name: Decide whether to publish
        id: decide
        run: |
          if [ "$FULL_RUN" = "true" ] || [ "${{ steps.notes.outputs.changed }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No newly approved notes; nothing to publish."
          fi

      - name: Save data
        if: steps.decide.outputs.publish == 'true'
        run: |
          git config user.name "news-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update news & staff notes $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi

      - name: Build site
        if: steps.decide.outputs.publish == 'true'
        run: python scripts/build_site.py

      - uses: actions/upload-pages-artifact@v3
        if: steps.decide.outputs.publish == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
