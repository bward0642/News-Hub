# 2) TEACHING TIPS: the newest 3 (from here and the form combined) show on the home page.
tips:
  - title: Check loan status before every repayment conversation
    tip: >
      Ask clients to sign in at StudentAid.gov and pull up "My Aid" during the session.
      Loan type, servicer, and repayment plan drive almost every recommendation.
    link: https://studentaid.gov/aid-summary/
    added: 2026-09-28
  - title: Free credit reports, every week
    tip: >
      All three bureaus offer free weekly reports at AnnualCreditReport.com — the only
      official site. A great live demo for credit workshops.
    link: https://www.annualcreditreport.com/
    added: 2026-09-28
  - title: Use the Loan Simulator for "what if" planning
    tip: >
      The federal Loan Simulator compares repayment plans using the client's real loans.
      Walk through it together rather than estimating by hand.
    link: https://studentaid.gov/loan-simulator/
    added: 2026-09-28
