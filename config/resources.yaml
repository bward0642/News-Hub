# Evergreen links shown on the Resources page and in the "Check these sites" sidebar.
# sidebar: true = also show on the home page as a site to check weekly by hand.

groups:
  - name: Student Loans & Aid
    links:
      - title: StudentAid.gov Announcements
        url: https://studentaid.gov/announcements-events
        note: Official updates from Federal Student Aid.
        sidebar: true
      - title: Ed.gov Press Releases
        url: https://www.ed.gov/about/news
        note: Department of Education news (no public feed, so check weekly).
        sidebar: true
      - title: FSA Partner Connect — Electronic Announcements
        url: https://fsapartners.ed.gov/knowledge-center/library/electronic-announcements
        note: Technical guidance sent to schools; often the earliest signal of change.
        sidebar: true
      - title: Loan Simulator
        url: https://studentaid.gov/loan-simulator/
        note: Compare repayment plans with a client's actual loans.
      - title: PSLF Help Tool
        url: https://studentaid.gov/pslf/
        note: Check employer eligibility and submit PSLF forms.
      - title: FAFSA Form
        url: https://studentaid.gov/h/apply-for-aid/fafsa
        note: Apply for federal student aid.

  - name: Credit, Banking & Consumer Protection
    links:
      - title: CFPB Consumer Tools
        url: https://www.consumerfinance.gov/consumer-tools/
        note: Plain-language guides on credit, debt, banking and more.
      - title: AnnualCreditReport.com
        url: https://www.annualcreditreport.com/
        note: The only official source for free credit reports.
      - title: Submit a CFPB Complaint
        url: https://www.consumerfinance.gov/complaint/
        note: For problems with banks, lenders, servicers or collectors.
      - title: ReportFraud.ftc.gov
        url: https://reportfraud.ftc.gov/
        note: Report scams and fraud.

  - name: Teaching & Curriculum
    links:
      - title: CFPB Educator Tools
        url: https://www.consumerfinance.gov/consumer-tools/educator-tools/
        note: Free lesson materials for youth and adults.
      - title: FDIC Money Smart
        url: https://www.fdic.gov/consumer-resource-center/money-smart
        note: Free financial education curriculum for all ages.
      - title: Next Gen Personal Finance (NGPF)
        url: https://www.ngpf.org/
        note: Free lessons, activities and teacher PD.
        sidebar: true
      - title: Jump$tart Clearinghouse
        url: https://www.jumpstart.org/what-we-do/support-financial-education/clearinghouse/
        note: Searchable library of vetted financial education resources.
      - title: MyMoney.gov
        url: https://www.mymoney.gov/
        note: The federal government's financial literacy site.
