name: Weekly update

on:
  schedule:
    - cron: "0 10 * * 1"   # Mondays 10:00 UTC (6 AM Eastern in summer, 5 AM in winter)
  workflow_dispatch:        # "Run workflow" button: update on demand (use after editing config)

permissions:
  contents: write   # save this week's news, market and policy data back to data/
  pages: write
  id-token: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch this week's news
        run: python scripts/fetch_news.py

      - name: Fetch market data
        run: python scripts/fetch_markets.py

      - name: Fetch policy updates
        run: python scripts/fetch_policy.py

      - name: Save news history
        run: |
          git config user.name "news-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Weekly update $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi

      - name: Build site
        run: python scripts/build_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
