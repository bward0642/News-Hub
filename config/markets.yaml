# Market Watch tab settings.
# Indicators come from FRED (Federal Reserve Bank of St. Louis), free and no key needed.
# Find more series at https://fred.stlouisfed.org (the ID is in the page address).
#
# compare: week  = change vs. the value one week earlier (daily series)
#          prior = change vs. the previous release (weekly/monthly series)
# change:  percent (stock indexes), points (rates, in percentage points), dollars
# transform: yoy = show the year-over-year % change instead of the raw level (CPI)
# sentence:  how the indicator is named in the "Week in brief" summary
# in_brief:  false = show the tile but leave it out of the summary

indicators:
  - id: SP500
    label: S&P 500
    sentence: The S&P 500
    format: "{:,.0f}"
    compare: week
    change: percent
    why: Tracks large U.S. companies; a common proxy for retirement and college savings accounts invested in stocks.
  - id: DJIA
    label: Dow Jones Industrial Average
    sentence: The Dow
    format: "{:,.0f}"
    compare: week
    change: percent
    why: A widely quoted index of 30 large U.S. companies.
  - id: NASDAQCOM
    label: Nasdaq Composite
    sentence: The Nasdaq
    format: "{:,.0f}"
    compare: week
    change: percent
    why: Weighted toward technology companies; often moves more than the broader market.
  - id: DGS10
    label: 10-year Treasury yield
    sentence: The 10-year Treasury yield
    format: "{:.2f}%"
    compare: week
    change: points
    why: A benchmark that influences mortgage rates and other long-term borrowing costs.
  - id: DFF
    label: Federal funds rate
    sentence: The federal funds rate
    format: "{:.2f}%"
    compare: week
    change: points
    why: The Federal Reserve's policy rate; flows through to credit card, savings, and variable loan rates.
  - id: MORTGAGE30US
    label: 30-year fixed mortgage rate
    sentence: The average 30-year fixed mortgage rate
    format: "{:.2f}%"
    compare: prior
    change: points
    why: The typical rate for a new home loan (Freddie Mac weekly survey).
  - id: GASREGW
    label: Average gas price (regular)
    sentence: The average price of regular gas
    format: "${:.2f}"
    compare: prior
    change: dollars
    why: A large, visible part of many household budgets.
  - id: CPIAUCSL
    label: Inflation (CPI, year over year)
    sentence: Year-over-year inflation (CPI)
    format: "{:.1f}%"
    transform: yoy
    compare: prior
    change: points
    why: How fast prices are rising overall; affects what a paycheck or savings can buy.
  - id: UNRATE
    label: Unemployment rate
    sentence: The unemployment rate
    format: "{:.1f}%"
    compare: prior
    change: points
    why: The share of people looking for work who don't have a job.
  - id: TERMCBCCALLNS
    label: Average credit card APR
    sentence: The average credit card APR
    in_brief: false
    format: "{:.2f}%"
    compare: prior
    change: points
    why: Average interest rate on credit card accounts that are charged interest.

# How much trend history each tile's sparkline shows.
sparkline_days: 92

# Official economic releases (shown if published within `days`).
releases:
  days: 40
  sources:
    - name: Bureau of Labor Statistics — Jobs report
      url: https://www.bls.gov/feed/empsit.rss
      latest_only: true
    - name: Bureau of Labor Statistics — Consumer prices
      url: https://www.bls.gov/feed/cpi.rss
      latest_only: true
    - name: Bureau of Economic Analysis
      url: https://apps.bea.gov/rss/rss.xml
      days: 10
      include_keywords: [GDP, Gross Domestic Product, Personal Income, Consumer Spending, Trade, Saving]

# From the Federal Reserve (official).
fed:
  days: 14
  sources:
    - name: Federal Reserve — Monetary policy
      url: https://www.federalreserve.gov/feeds/press_monetary.xml
      days: 45
      latest_only: true
    - name: Federal Reserve — Speeches
      url: https://www.federalreserve.gov/feeds/speeches.xml
      max_items: 5

# Analysis & commentary (opinions are the authors' own). Neutrality filter still applies.
commentary:
  days: 7
  max_items: 12
  keywords: [market, markets, stocks, stock, bonds, bond, yield, yields, rates, rate, inflation,
             Fed, Federal Reserve, economy, economic, recession, jobs, mortgage, earnings,
             investors, S&P, Dow, Nasdaq, Treasury, recap, week ahead, your money, savings]
  # Skip speculative or off-topic items.
  exclude_keywords: [Kalshi, Polymarket, prediction market, prediction markets, crypto, bitcoin,
                     meme stock, meme stocks, options trade, day trading]
  sources:
    - name: CNBC — Economy
      type: rss
      url: https://www.cnbc.com/id/20910258/device/rss/rss.html
    - name: CNBC — Investing
      type: rss
      url: https://www.cnbc.com/id/15839069/device/rss/rss.html
    - name: Kiplinger — Investing
      type: rss
      url: https://www.kiplinger.com/investing/feed
    - name: Weekly market recaps
      type: google_news
      query: '"weekly market recap" OR "week in review" stocks'
    - name: What it means for your money
      type: google_news
      query: '"what it means for your money" OR "what it means for you" (rates OR inflation OR stocks OR mortgage)'
